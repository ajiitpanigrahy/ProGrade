# ==========================================
# PRODUCTION CLOUD CONFIGURATION (RENDER)
# ==========================================

# Aiven Cloud Database (Injected via Render Dashboard)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Turn off SQL logging to save cloud memory and disk space
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Turn off Flyway since we executed the migration script manually via DBeaver
spring.flyway.enabled=false

# Enable HTTP/2 for massive concurrent request speedups during page refreshes
server.http2.enabled=true

# ==========================================
# OPTIMIZED SERVER CONCURRENCY
# ==========================================
# 150 threads easily fits in 512MB RAM but prevents SSE starvation
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=1000

# ==========================================
# DB CONNECTION POOL & TIMEOUTS
# ==========================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
# CRITICAL: If the DB is busy, fail after 5 seconds instead of infinite loading!
spring.datasource.hikari.connection-timeout=5000