spring.application.name=ProGradeBackend

# ==========================================
# SERVER CONFIGURATION
# ==========================================
# The port your Spring Boot backend will run on
server.port=2406

# ==========================================
# DATASOURCE CONFIGURATION (MySQL)
# ==========================================
# Update 'pro_grade_db' to whatever you name your database in MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ProGradedatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Your MySQL credentials
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# 'update' automatically modifies your database schema to match your Entity classes.
# Note: Change this to 'validate' or 'none' when moving to production!
spring.jpa.hibernate.ddl-auto=update

# Show all SQL queries generated by Hibernate in the console (great for debugging)
spring.jpa.show-sql=true
# Format the SQL queries in the console so they are readable, rather than one long line
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Hibernate to use the MySQL dialect for optimized query generation
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Increase Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# JWT SECURITY CONFIGURATION (Custom Variables)
# ==========================================
# Secret key for signing JWTs. Must be at least 256-bit (32+ characters).
# Keep this safe and use environment variables for this in production!
prograde.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity duration in milliseconds (86400000 ms = 24 hours)
prograde.app.jwtExpirationMs=86400000