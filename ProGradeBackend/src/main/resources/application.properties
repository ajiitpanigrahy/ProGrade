spring.application.name=ProGradeBackend

# ==========================================
# SERVER CONFIGURATION
# ==========================================
# The port your Spring Boot backend will run on
server.port=2406

# ==========================================
# DATASOURCE CONFIGURATION (MySQL)
# ==========================================
# Update 'ProGradedatabase' to whatever you name your database in MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ProGradedatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Your MySQL credentials
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# 'update' automatically modifies your database schema to match your Entity classes.
# Note: Change this to 'validate' or 'none' when moving to production!
# 1. Wipes your data and creates brand-new empty tables
spring.jpa.hibernate.ddl-auto=validate

# 2. Forces Hibernate to output the clean SQL script straight to your Flyway folder
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__Initial_Schema.sql

#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__Initial_Schema.sql
#spring.flyway.enabled=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# 3. Temporarily turn off Flyway so it doesn't get in the way during this wipe phase
#spring.flyway.enabled=false


# Show all SQL queries generated by Hibernate in the console (great for debugging)
spring.jpa.show-sql=true
# Format the SQL queries in the console so they are readable, rather than one long line
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Hibernate to use the MySQL dialect for optimized query generation
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Increase Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# JWT SECURITY CONFIGURATION (Custom Variables)
# ==========================================
# Secret key for signing JWTs. Must be at least 256-bit (32+ characters).
# Keep this safe and use environment variables for this in production!
prograde.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity duration in milliseconds (86400000 ms = 24 hours)
prograde.app.jwtExpirationMs=86400000

#Gemini API Key 
gemini.api.key=${GEMINI_API_KEY:}

# Admin configuration blueprints
app.admin.email=${ADMIN_BOOTSTRAP_EMAIL}
app.admin.password=${ADMIN_BOOTSTRAP_PASSWORD}


# ==========================================
# OAUTH2 GOOGLE & GITHUB CONFIGURATION
# ==========================================

# GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# GITHUB
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user


# ==========================================
# MAIL INFRASTRUCTURE CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Secure dynamic parameter placeholders
spring.mail.username=${SYSTEM_MAIL_USERNAME}
spring.mail.password=${SYSTEM_MAIL_PASSWORD}

# SMTP Security Handshaking Options
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




# ==========================================
# RESILIENCE4J FAULT TOLERANCE CONFIGURATION
# ==========================================

# 1. Email Circuit Breaker (OTP Service)
resilience4j.circuitbreaker.instances.emailService.sliding-window-size=5
resilience4j.circuitbreaker.instances.emailService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.emailService.wait-duration-in-open-state=15000ms

# 2. Gemini AI Circuit Breaker & Retry
resilience4j.circuitbreaker.instances.geminiApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiApi.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.geminiApi.wait-duration-in-open-state=30000ms

resilience4j.retry.instances.geminiApi.max-attempts=3
resilience4j.retry.instances.geminiApi.wait-duration=2000ms


# ==========================================
# REDIS CACHE INFRASTRUCTURE
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms

# Enable Spring Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=604800000
# 7 days in milliseconds (or customize as needed)
spring.cache.redis.cache-null-values=false

spring.devtools.restart.additional-exclude=src/main/resources/db/migration/**

# Increase max active connections to MySQL from 10 to 30
spring.datasource.hikari.maximum-pool-size=30
# Minimum number of idle connections Hikari keeps open in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum time (in milliseconds) a request will wait for a connection before timing out (30 seconds)
spring.datasource.hikari.connection-timeout=30000
# Maximum lifetime of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000


# Enable HTTP payload compression
server.compression.enabled=true
# Minimum response size to trigger compression (2KB)
server.compression.min-response-size=2048
# Content types that should be compressed
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/xml

# Maximum worker threads Tomcat can spin up (default is 200)
server.tomcat.threads.max=250
# Minimum worker threads always kept alive to handle instant traffic
server.tomcat.threads.min-spare=20
# Maximum number of connections the server will accept and queue at any given time
server.tomcat.max-connections=8192


