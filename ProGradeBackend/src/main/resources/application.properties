# ==========================================
# DEFAULT PROFILE & SERVER
# ==========================================
# Forces the app to use application-dev.properties on your laptop by default
spring.profiles.active=dev

spring.application.name=ProGradeBackend
server.port=2406

# ==========================================
# JPA / HIBERNATE COMMON CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# JWT SECURITY & ADMIN CONFIGURATION
# ==========================================
# Uses an environment variable in production, falls back to this default locally
prograde.app.jwtSecret=${JWT_SECRET}
#prograde.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
prograde.app.jwtExpirationMs=86400000

app.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# ==========================================
# EXTERNAL APIs (Gemini, OAuth)
# ==========================================
gemini.api.key=${GEMINI_API_KEY:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ==========================================
# MAIL INFRASTRUCTURE
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SYSTEM_MAIL_USERNAME:}
spring.mail.password=${SYSTEM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# RESILIENCE4J FAULT TOLERANCE
# ==========================================
resilience4j.circuitbreaker.instances.emailService.sliding-window-size=5
resilience4j.circuitbreaker.instances.emailService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.emailService.wait-duration-in-open-state=15000ms

resilience4j.circuitbreaker.instances.geminiApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiApi.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.geminiApi.wait-duration-in-open-state=30000ms
resilience4j.retry.instances.geminiApi.max-attempts=3
resilience4j.retry.instances.geminiApi.wait-duration=2000ms

# ==========================================
# DB CONNECTION POOL (HIKARI)
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# SERVER / TOMCAT OPTIMIZATIONS
# ==========================================
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/xml
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
spring.devtools.restart.additional-exclude=src/main/resources/db/migration/**